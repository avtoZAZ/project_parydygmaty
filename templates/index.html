<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Smart Kitchen AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>
<canvas id="bg-grid"></canvas>
<div class="app">
  <header class="hero glass">
    <h1>🤖 Smart Kitchen AI</h1>
    <p>Cyberpunkowy doradca wyboru obiadu oparty na Prologu</p>
  </header>

  <section class="glass fridge">
    <h2>🧊 Twoja lodówka</h2>
    <div class="counter">Wybrane składniki: <span id="counter">0</span></div>
    <div id="chips" class="chips"></div>
    <button id="findBtn">Znajdź obiad</button>
    <div class="progress-wrap"><div id="progress"></div></div>
  </section>

  <section id="loader" class="glass hidden">
    <h3>Skanuję składniki...</h3>
    <p>Analizuję przepisy w Prologu...</p>
    <p>Szukam najlepszego obiadu...</p>
  </section>

  <section id="result" class="hidden"></section>
</div>
<script>window.INGREDIENTS={{ ingredients|tojson }};</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
